_schema-version: 3.3.0
ID: cap-discovery-ingestion
version: 1.0.0
description: CAP discovery ingestion — Node.js OData service, XSUAA, HANA HDI

modules:
  - name: cap-discovery-ingestion-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      memory: 256M
      disk-quota: 512M
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: cap-discovery-ingestion-auth
      - name: cap-discovery-ingestion-db

  - name: cap-discovery-ingestion-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      memory: 256M
      disk-quota: 512M
    requires:
      - name: cap-discovery-ingestion-db

resources:
  - name: cap-discovery-ingestion-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: xs-security.json

  - name: cap-discovery-ingestion-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
